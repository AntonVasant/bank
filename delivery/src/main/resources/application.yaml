spring:
  application:
    name: delivery

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5436}/deliverydb
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: delivery-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  task:
    scheduling:
      pool:
        size: 5
      thread-name-prefix: scheduler-

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    metrics:
      enabled: true

server:
  port: 8084

# gRPC endpoints for each bank's SettlementReportService (exposed by the
# transaction/bank application), used to deliver each settlement cycle's
# net position after it is consumed from Kafka.
banks:
  grpc:
    endpoints:
      HDFC_IN:
        host: localhost
        port: 9091
      AXIS_IN:
        host: localhost
        port: 9095
  # REST base URL for each bank's reconciliation endpoint
  # (POST /api/reconciliation), used to deliver each settlement cycle's
  # reconciliation request after it is consumed from Kafka.
  rest:
    endpoints:
      HDFC_IN:
        base-url: http://localhost:8081
      AXIS_IN:
        base-url: http://localhost:8080

logging:
  level:
    com.delivery: INFO
  file:
    name: logs/delivery.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      file-name-pattern: logs/delivery.%d{yyyy-MM-dd}.%i.log
