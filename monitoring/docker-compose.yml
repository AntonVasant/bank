services:

  postgres-exporter-banka:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter-banka
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@host.docker.internal:5434/paymentdb_banka?sslmode=disable"
    ports:
      - "9187:9187"

  postgres-exporter-bankb:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter-bankb
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@host.docker.internal:5435/paymentdb_bankb?sslmode=disable"
    ports:
      - "9188:9187"

  postgres-exporter-rail:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter-rail
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@host.docker.internal:5433/rail?sslmode=disable"
    ports:
      - "9189:9187"

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    # 9090 is taken on the host by rail's gRPC server, so map to 9099 instead.
    ports:
      - "9099:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - postgres-exporter-banka
      - postgres-exporter-bankb
      - postgres-exporter-rail

  grafana:
    image: grafana/grafana
    container_name: grafana
    # 3000 is taken on the host by tigerbeetle-rail, so map to 3001 instead.
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
